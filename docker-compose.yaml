name: python-base

services:
  dev:
    build:
      context: .
      target: dev
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./pyproject.toml:/app/pyproject.toml
      - ./uv.lock:/app/uv.lock
      - ./README.md:/app/README.md
      - uv-cache:/root/.cache/uv
    environment:
      PYTHONUNBUFFERED: "1"
    command: ["sleep", "infinity"]
    tty: true
    stdin_open: true

volumes:
  uv-cache:
