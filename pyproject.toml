[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "python-base"
version = "0.1.0"
description = ""
authors = [
    {name = "Elliot Nest",email = "elliot.pm.nest@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
]

[project.optional-dependencies]
dev = [
    "pytest >=9.0.2, <10.0.0",
    "ruff >=0.14.14, <1.0.0",
    "mypy >=1.19.1, <2.0.0",
    "pre-commit >=4.5.1, <5.0.0"
]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
pretty = true
mypy_path = ["src"]
files = ["src", "tests"]


[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "N",
    "D",
    "ANN",
    "TCH",
]
ignore = [
    "D203",
    "D212",
]